{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Social Book{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'upload_books' %}">Upload Books</a></li>
                <li><a href="{% url 'authors' %}">Authors</a></li>
                <li><a href="{% url 'sellers' %}">Sellers</a></li>
                <li><a href="{% url 'login' %}">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- Content specific to each page will be injected here -->
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 Social Book</p>
    </footer>
</body>
</html>
